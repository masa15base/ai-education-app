name: Feature request
description: 新機能・改善（PM Bot が整形しやすい形）
title: "[Feature] "
labels: ["enhancement", "bot/pm"]
body:
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: なぜ必要か（1〜3行）
      placeholder: 保護者が週間の学習状況を一目で把握したい…
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: ユーザーストーリー
      placeholder: 保護者として、ログイン後に…したい。なぜなら…
    validations:
      required: true
  - type: textarea
    id: ac
    attributes:
      label: 受け入れ条件（AC）
      description: 検証可能なチェックリスト
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 想定エリア
      options:
        - frontend
        - backend
        - frontend + backend（分割が必要）
        - docs
        - infra
        - 不明（PM Bot に判断してほしい）
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      placeholder: 今回やらないこと
  - type: dropdown
    id: priority
    attributes:
      label: 優先度（仮）
      options:
        - p2
        - p1
        - p0
        - p3
    validations:
      required: true
