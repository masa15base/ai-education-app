<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>まなとも プライバシーポリシー（健康データ）</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        line-height: 1.6;
        padding: 1rem;
        max-width: 40rem;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <h1>健康データの取り扱い</h1>
    <p>
      まなともは、学習キャラクターの成長演出のために、お子さまの<strong>歩数</strong>のみを
      Health Connect（Android）またはヘルスケア（iOS）から読み取ります。
    </p>
    <h2>収集するデータ</h2>
    <ul>
      <li>1日の歩数（集計値）</li>
    </ul>
    <h2>利用目的</h2>
    <ul>
      <li>ホーム画面・保護者ダッシュボードでの歩数表示</li>
      <li>目標達成に応じた経験値ボーナスの付与</li>
    </ul>
    <h2>保存・共有</h2>
    <p>
      歩数はログイン中のアカウントに紐づけてサーバー（Heroku / MySQL）に保存します。
      第三者への販売・広告目的での利用は行いません。
    </p>
    <h2>お問い合わせ</h2>
    <p>アプリ内の保護者向け画面、または運営者までご連絡ください。</p>
  </body>
</html>
